<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif PJOK</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #16a34a;
            --success-light: #f0fdf4;
            --danger: #dc2626;
            --danger-light: #fef2f2;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .quiz-container {
            max-width: 640px;
            width: 100%;
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .quiz-header {
            margin-bottom: 32px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .progress-bar {
            flex-grow: 1;
            height: 6px;
            background-color: var(--border);
            border-radius: 100px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question-number {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.6;
            color: var(--text-main);
            margin-top: 16px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            background-color: var(--card);
            border: 1.5px solid var(--border);
            padding: 16px 24px;
            border-radius: 14px;
            text-align: left;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--text-muted);
            background-color: #f8fafc;
            transform: translateY(-1px);
        }

        .option-btn.correct {
            background-color: var(--success-light);
            border-color: var(--success);
            color: #14532d;
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: var(--danger-light);
            border-color: var(--danger);
            color: #7f1d1d;
        }

        .status-icon {
            display: none;
            width: 20px;
            height: 20px;
        }

        .option-btn.correct .icon-correct,
        .option-btn.wrong .icon-wrong {
            display: block;
        }

        .reason-box {
            margin-top: 24px;
            padding: 20px;
            background-color: var(--primary-light);
            border-radius: 16px;
            border: 1px solid #dbeafe;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .reason-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            color: #1e40af;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reason-text {
            font-size: 0.975rem;
            line-height: 1.5;
            color: #1e3a8a;
        }

        .next-btn {
            margin-top: 32px;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .next-btn:hover {
            background-color: var(--primary-hover);
        }

        .result-screen {
            text-align: center;
            display: none;
            padding: 20px 0;
        }

        .score-badge {
            display: inline-block;
            background: var(--primary-light);
            padding: 32px;
            border-radius: 50%;
            margin: 24px 0;
        }

        .score {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
        }

        .result-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .result-summary {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .watermark {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 24px;
            text-align: center;
            opacity: 0.7;
        }

        /* Floating AI Control Panel */
        .ai-floating-btn {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background-color: #0f172a;
            color: white;
            border: none;
            border-radius: 100px;
            padding: 14px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            z-index: 999;
        }

        .ai-floating-btn:hover {
            background-color: #1e293b;
            transform: translateY(-2px);
        }

        .ai-modal {
            display: none;
            position: fixed;
            bottom: 96px;
            right: 32px;
            width: 300px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
            overflow: hidden;
            z-index: 1000;
            animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .ai-modal-header {
            background: #f8fafc;
            padding: 16px 20px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ai-modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
        }

        .ai-modal-close:hover { color: var(--text-main); }

        .ai-options-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ai-link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        .ai-link-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .ai-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="quiz-container">

        <div class="quiz-header">

            <span>Ulangi Kuis</span>
        </button>
    </div>
</div>

<script>
const quizData = [
    {q: "Melempar bola dari jarak tertentu dengan tujuan memasukkannya ke dalam ring disebut...", o: ["Shooting", "Passing", "Overhead pass", "Dribbling", "Chest pass"], a: 0, r: "Usaha memasukkan bola ke dalam ring disebut menembak bola (shooting)."},
    {q: "Upaya memasukkan bola ke dalam keranjang sambil melayang dan terlebih dahulu diawali dengan gerakan melangkah (melompat dengan satu kaki) disebut dengan istilah...", o: ["Pivot", "Jump shoot", "Lay up shoot", "Standing shoot", "Slam dunk"], a: 2, r: "Tembakan (shoot) yang dilakukan dengan menggunakan variasi melangkah (kaki) ke arah ring basket disebut lay up."},
    {q: "Teknik mengoper bola ke teman dengan memegang bola di atas kepala lalu dilemparkan ke arah teman dengan jarak yang jauh adalah teknik melempar...", o: ["Underhand pass", "Bounce pass", "Overhead pass", "Chest pass", "Back pass"], a: 2, r: "Operan bola basket yang dilakukan dari posisi di atas kepala dinamakan overhead pass."},
    {q: "Lemparan dalam permainan bola basket yang digunakan untuk operan jarak pendek adalah...", o: ["Chest pass", "Overhand pass", "Bounce pass", "Baseball pass", "Dribbling"], a: 0, r: "Chest pass merupakan operan setinggi dada yang lazim digunakan untuk jarak pendek yang cepat dan akurat."},
    {q: "Gerakan lay up shoot diawali dengan melangkah sebanyak...", o: ["1 langkah", "2 langkah", "3 langkah", "4 langkah", "5 langkah"], a: 1, r: "Secara aturan dasar teknis bola basket, gerakan lay up yang sah diawali dengan memegang bola lalu melangkah sebanyak maksimal dua langkah sebelum melompat menembak."},
    {q: "Di bawah ini yang merupakan teknik dasar passing dalam permainan bola basket adalah...", o: ["Push up", "Zig-zag run", "Back up", "Chest pass", "Sit up"], a: 3, r: "Chest pass (operan dada) adalah salah satu jenis teknik mengoper dasar (passing) dalam bola basket."},
    {q: "Menggiring / memantul-mantulkan bola sering disebut dengan istilah...", o: ["Dribbling", "Shooting", "Passing", "Chest pass", "Bounce pass"], a: 0, r: "Usaha membawa bola dengan cara mendorong atau memantul-mantulkannya ke lantai disebut dribbling."},
    {q: "Di bawah ini yang bukan merupakan teknik melempar dengan 2 tangan adalah...", o: ["Chest pass", "Back pass", "Overhand pass", "Bounce pass", "Underhand pass"], a: 1, r: "Teknik operan dasar dua tangan yang dipelajari meliputi chest pass, overhead pass, dan bounce pass. Back pass (operan di belakang punggung) adalah teknik tingkat lanjut menggunakan satu tangan."},
    {q: "Nama orang yang menciptakan bola basket adalah...", o: ["Dr. James Naismith", "William G. Morgan", "John Arthur", "Juan Carlos", "Ebenezer Morley"], a: 0, r: "Olahraga bola basket diciptakan oleh Dr. James Naismith pada tahun 1891 di Amerika Serikat."},
    {q: "Keterampilan utama yang harus kita pelajari dalam permainan bola basket adalah...", o: ["Menangkap bola", "Mengoper bola", "Melempar bola", "Menggiring bola", "Menendang bola"], a: 1, r: "Mengoper bola (passing) merupakan inti dasar dari permainan invasi kelompok untuk menyusun serangan kolektif."},
    {q: "Teknik dasar pivot adalah...", o: ["Gerakan mengoper atau memberikan bola ke teman", "Membawa bola dengan cara memantul-mantulkannya ke lantai dengan satu tangan", "Gerakan memegang sisi bola dengan kedua tangan dan menjaga siku tetap rapat di samping badan", "Menembak bola dan memasukkannya ke dalam ring", "Gerakan memputar salah satu kaki sebagai porosnya dan posisi kedua tangan memegang bola"], a: 4, r: "Teknik dasar pivot adalah gerakan menyelamatkan bola dengan cara memutar badan bertumpu pada salah satu kaki yang bertindak sebagai poros (pivot foot)."},
    {q: "Bounce pass adalah...", o: ["Mengoper bola dari atas kepala", "Mengoper bola dari depan dada", "Mengoper bola dengan memantulkannya ke lantai sebelum diterima teman", "Mengoper bola ke samping badan", "Mengoper bola ke segala sisi"], a: 2, r: "Bounce pass secara harfiah merupakan operan dengan cara memantulkan bola ke lantai."},
    {q: "Posisi jari tangan saat bola masuk di antara kedua tangan adalah...", o: ["Dirapatkan dan ditekuk ke dalam", "Segera melekat ke bola", "Mengikuti arah bola", "Menangkap dan menarik ke belakang", "Menguasai bola"], a: 1, r: "Teknik menangkap bola (catching) mengharuskan jari tangan terbuka lebar agar bola dapat melekat erat di telapak tangan tanpa tergelincir."},
    {q: "Nama lain dari aktivitas pembelajaran keterampilan gerak mengoper dan menangkap bola dengan formasi berbanjar adalah...", o: ["Shooting", "Dribbling", "Zig-zag", "Passing run", "Rolling"], a: 3, r: "Pembelajaran berbanjar mengalir dikombinasikan dengan lari perpindahan posisi disebut passing run."},
    {q: "Sikap awal gerak menggiring bola zig-zag yang diawali dari garis start adalah...", o: ["Badan agak condong ke depan", "Berdiri dengan sikap melangkah", "Berat badan tertumpu pada kaki depan", "Menggiring bola zig-zag", "Lari berantai berputar"], a: 1, r: "Sikap seimbang awal untuk bersiap mendribble dinamis maju (seperti zig-zag) diawali dengan berdiri dengan posisi kaki melangkah."},
    {q: "Teknik menembakkan bola disebut...", o: ["Foul", "Pivot", "Shooting", "Rebound", "Passing"], a: 2, r: "Usaha untuk mengarahkan dan memasukkan bola menuju ring sasaran demi mencetak angka disebut shooting."},
    {q: "Yang dimaksud dengan violation adalah...", o: ["Pelanggaran langsung terhadap fisik lawan", "Pelanggaran yang lebih condong ke peraturan permainan basket (teknis)", "Pelanggaran menginjak garis lawan", "Pelanggaran keluar dari lapangan", "Pelanggaran memukul pemain lawan"], a: 1, r: "Berbeda dengan foul yang melibatkan kontak fisik ilegal, violation adalah pelanggaran teknis peraturan (seperti traveling atau double dribble)."},
    {q: "Posisi bola pada saat melakukan operan overhand pass adalah...", o: ["Bola diayunkan dari atas kepala ke arah depan", "Di depan kaki pada jarak 1-2 meter", "Maju dengan mengikuti arah kaki bagian dalam", "Didorong ke samping menyesuaikan kecepatan", "Fokuskan bola ke arah tiang"], a: 0, r: "Pada operan atas kepala, bola dipegang di atas kepala lalu diayun mendorong ke depan menuju rekan setim."},
    {q: "Jenis dribble yang dilakukan dengan tempo pantulan yang cepat dengan tujuan menghindari penjagaan lawan dan digunakan untuk menerobos dinding pertahanan lawan disebut...", o: ["Dribbling rendah", "Dribbling sedang", "Dribbling tinggi", "Dribbling bawah", "Dribbling samping"], a: 2, r: "Menerobos dinding pertahanan lawan dalam konteks ini menekankan pada aspek kecepatan maju (speed dribble). Untuk itu dibutuhkan pantulan bola yang cukup tinggi agar langkah kaki pemain dapat bergerak maksimal."},
    {q: "Pada saat gerakan lay up, langkah kaki gerakan lay up kanan saat bola dipegang dengan kedua tangan adalah...", o: ["Melangkah sebanyak dua langkah", "Mengeblok lawan", "Melangkah ke belakang", "Melompat jauh", "Menembak sambil melayang"], a: 0, r: "Saat melakukan rangkaian lay up kanan, langkah kaki dibatasi maksimal dua langkah sembari menguasai bola di tangan sebelum melakukan lompatan."},
    {q: "Permainan bola basket diciptakan pada tahun...", o: ["1945", "1891", "1981", "1889", "1898"], a: 1, r: "Bola basket diciptakan pertama kali secara resmi pada tahun 1891 oleh Dr. James Naismith."},
    {q: "Operan setinggi dada disebut...", o: ["Bounce pass", "Overhand pass", "Chest pass", "Side hand pass", "Front chest pass"], a: 2, r: "Chest pass adalah teknik mengoper bola setinggi dada."},

let currentQuestionIndex = 0;
let score = 0;

function loadQuestion() {
    const currentQuestion = quizData[currentQuestionIndex];
    document.getElementById("progress").style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;
    document.getElementById("q-num").innerText = `Soal ${currentQuestionIndex + 1} dari ${quizData.length}`;
    document.getElementById("q-text").innerText = currentQuestion.q;
    
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";
    document.getElementById("reason-box").style.display = "none";
    document.getElementById("next-btn").style.display = "none";
    
    currentQuestion.o.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option-btn";
        
        const textSpan = document.createElement("span");
        textSpan.innerText = `${String.fromCharCode(97 + index)}. ${option}`;
        button.appendChild(textSpan);

        const iconSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        iconSvg.setAttribute("class", "status-icon");
        iconSvg.setAttribute("viewBox", "0 0 24 24");
        iconSvg.setAttribute("fill", "none");
        iconSvg.setAttribute("stroke", "currentColor");
        iconSvg.setAttribute("stroke-width", "2.5");
        iconSvg.setAttribute("stroke-linecap", "round");
        iconSvg.setAttribute("stroke-linejoin", "round");
        button.appendChild(iconSvg);

        button.onclick = () => selectOption(index, button);
        optionsContainer.appendChild(button);
    });
}

function selectOption(selectedIndex, clickedButton) {
    const currentQuestion = quizData[currentQuestionIndex];
    const allButtons = document.querySelectorAll(".option-btn");
    allButtons.forEach(btn => btn.disabled = true);
    
    if (selectedIndex === currentQuestion.a) {
        clickedButton.classList.add("correct");
        clickedButton.querySelector(".status-icon").innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
        clickedButton.querySelector(".status-icon").classList.add("icon-correct");
        score += 2;
    } else {
        clickedButton.classList.add("wrong");
        clickedButton.querySelector(".status-icon").innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
        clickedButton.querySelector(".status-icon").classList.add("icon-wrong");
        
        const correctButton = allButtons[currentQuestion.a];
        correctButton.classList.add("correct");
        correctButton.querySelector(".status-icon").innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
        correctButton.querySelector(".status-icon").classList.add("icon-correct");
    }
    
    document.getElementById("reason-text").innerText = currentQuestion.r;
    document.getElementById("reason-box").style.display = "block";
    document.getElementById("next-btn").style.display = "flex";
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < quizData.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-window").style.display = "none";
    document.getElementById("result-window").style.display = "block";
    document.getElementById("final-score").innerText = score;
    
    let summary = "";
    if (score === 100) summary = "Sempurna! Kamu menguasai seluruh materi PJOK dengan sangat baik.";
    else if (score >= 80) summary = "Hebat sekali! Pemahaman teorimu sudah sangat mantap.";
    else if (score >= 60) summary = "Cukup bagus! Sedikit ulasan materi lagi agar hasilnya makin maksimal.";
    else summary = "Mari pelajari lagi alasannya dan coba ulangi kuisnya dari awal.";
    
    document.getElementById("score-summary").innerText = summary;
}

function toggleAiModal() {
    const modal = document.getElementById("aiModal");
    modal.style.display = (modal.style.display === "block") ? "none" : "block";
}

window.onclick = function(event) {
    const modal = document.getElementById("aiModal");
    const btn = document.querySelector(".ai-floating-btn");
    if (event.target !== modal && event.target !== btn && !btn.contains(event.target) && !modal.contains(event.target)) {
        modal.style.display = "none";
    }
}

loadQuestion();
</script>
